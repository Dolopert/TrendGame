[project]
name = "game-radar"
version = "0.1.0"
description = "จับเกม Steam ที่กำลังพุ่ง แล้วคัดเฉพาะตัวที่เอาไปปล่อยเช่าไอดีได้"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "websocket-client>=1.6"]

[project.scripts]
game-radar = "game_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_radar"]
