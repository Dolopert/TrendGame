name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: เปิด Pages ให้เองถ้ายังไม่ได้เปิด
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: อัปโหลดเฉพาะโฟลเดอร์ docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
